    PilotPublicIntakeLinkEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/PilotPublicIntakeLink"
      required: [data]
    MembershipEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/Membership"
      required: [data]
    MembershipListEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
