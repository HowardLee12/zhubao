            $ref: "#/components/schemas/Membership"
        meta:
          $ref: "#/components/schemas/ListMeta"
      required: [data, meta]
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        legalName:
          type: [string, "null"]
          maxLength: 200
        phone:
          anyOf:
            - $ref: "#/components/schemas/E164Phone"
            - type: "null"
        timezone:
          type: string
          maxLength: 64
          default: Asia/Taipei
        locale:
          type: string
