        skippedNoConsent:
          type: integer
          minimum: 0
        skippedDuplicate:
          type: integer
          minimum: 0
        notificationIds:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Uuid"
      required: [prepared, skippedNoConsent, skippedDuplicate, notificationIds]
    PreparedNotificationsEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/PreparedNotifications"
      required: [data]

    NotificationAttempt:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        attemptNo:
          type: integer
          minimum: 1
        startedAt:
          $ref: "#/components/schemas/Timestamp"
        finishedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        outcome:
          type: string
          enum: [sent, retry, failed]
        providerCode:
          type: [string, "null"]
          maxLength: 100
        errorCategory:
          type: [string, "null"]
          maxLength: 100
      required: [id, attemptNo, startedAt, finishedAt, outcome, providerCode, errorCategory]
    Notification:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        channel:
          $ref: "#/components/schemas/NotificationChannel"
        status:
          $ref: "#/components/schemas/NotificationStatus"
        approvalStatus:
          $ref: "#/components/schemas/NotificationApprovalStatus"
        recipientDisplay:
          type: string
          description: Redacted destination such as LINE…8K2; never a credential.
          maxLength: 200
        subject:
          type: [string, "null"]
          maxLength: 300
        messagePreview:
          type: string
          maxLength: 500
        relatedType:
          type: string
          maxLength: 64
        relatedId:
          $ref: "#/components/schemas/Uuid"
        scheduledAt:
          $ref: "#/components/schemas/Timestamp"
        sentAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        nextAttemptAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        attemptCount:
          type: integer
          minimum: 0
        attempts:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/NotificationAttempt"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
      required: [id, channel, status, approvalStatus, recipientDisplay, subject, messagePreview, relatedType, relatedId, scheduledAt, sentAt, nextAttemptAt, attemptCount, attempts, createdAt, updatedAt]
    ApproveNotificationsRequest:
      type: object
      additionalProperties: false
      properties:
        notificationIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Uuid"
      required: [notificationIds]
    CancelNotificationRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: [string, "null"]
          maxLength: 1000
    NotificationBatch:
      type: object
      additionalProperties: false
      properties:
        approved:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Uuid"
        rejected:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/NotificationBatchRejection"
      required: [approved, rejected]
    NotificationBatchRejection:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
      required: [id, code]
    NotificationEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/Notification"
      required: [data]
    NotificationListEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        meta:
          $ref: "#/components/schemas/ListMeta"
      required: [data, meta]
    NotificationBatchEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/NotificationBatch"
      required: [data]

    LineChannel:
      type: object
      additionalProperties: false
      description: Safe metadata only; no secret, token, ciphertext or secret-length hint.
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
          maxLength: 200
        channelId:
          type: string
          minLength: 1
          maxLength: 100
        liffId:
          type: [string, "null"]
          maxLength: 100
        status:
          $ref: "#/components/schemas/LineChannelStatus"
        credentialConfigured:
          type: boolean
        credentialVersion:
          type: integer
          minimum: 1
        webhookUrl:
          type: string
          format: uri
        verifiedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        lockVersion:
          $ref: "#/components/schemas/LockVersion"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
      required: [id, name, channelId, liffId, status, credentialConfigured, credentialVersion, webhookUrl, verifiedAt, lockVersion, createdAt, updatedAt]
    CreateLineChannelRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        channelId:
          type: string
          minLength: 1
          maxLength: 100
        channelSecret:
          type: string
          writeOnly: true
          minLength: 16
          maxLength: 512
        channelAccessToken:
          type: string
          writeOnly: true
          minLength: 32
          maxLength: 4096
        liffId:
          type: [string, "null"]
          maxLength: 100
      required: [name, channelId, channelSecret, channelAccessToken]
    UpdateLineChannelRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        liffId:
          type: [string, "null"]
          maxLength: 100
    RotateLineTokenRequest:
      type: object
      additionalProperties: false
      properties:
        channelAccessToken:
          type: string
          writeOnly: true
          minLength: 32
          maxLength: 4096
      required: [channelAccessToken]
    DisableLineChannelRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: [string, "null"]
          maxLength: 1000
    LineChannelEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/LineChannel"
      required: [data]
    LineChannelListEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LineChannel"
      required: [data]
    LineWebhookPayload:
      type: object
      description: |
        Provider-owned JSON verified from raw bytes before decoding. Unknown provider
        fields are intentionally accepted for forward compatibility, while the server
        separately caps body bytes and event count.
      additionalProperties: true
      properties:
        destination:
          type: string
          minLength: 1
          maxLength: 200
        events:
          type: array
          maxItems: 100
          items:
            type: object
            description: Provider event persisted as an encrypted/redacted inbox payload.
            additionalProperties: true
      required: [destination, events]
    WebhookAcknowledgement:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
      required: [ok]

