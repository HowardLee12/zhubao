components:
  securitySchemes:
    employeeSession:
      type: apiKey
      in: cookie
      name: session
      description: |
        Logical HttpOnly, Secure, SameSite session cookie issued by the server-side
        Supabase Auth adapter. Provider access and refresh tokens are never exposed.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required for employee mutations in addition to the session cookie.
    lineSignature:
      type: apiKey
      in: header
      name: X-Line-Signature
      description: Base64 HMAC-SHA256 signature verified over the exact raw request bytes.
    workerBearer:
      type: http
      scheme: bearer
      bearerFormat: short-lived service JWT
      description: Audience-restricted workload identity; never accepted by employee routes.

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      description: Organization tenant boundary checked against the active membership.
      schema:
        $ref: "#/components/schemas/Uuid"
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    PublicToken:
      name: token
      in: path
      required: true
      description: Opaque, scoped, expiring and revocable public capability token.
      schema:
        type: string
        minLength: 32
        maxLength: 512
        pattern: "^[A-Za-z0-9._~-]+$"
    LineChannelId:
      name: lineChannelId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag containing the last observed positive lock version.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        examples: ['"3"']
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Scoped to actor, organization, method and route template.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Recommended on create operations; identical retries replay the first result.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    Cursor:
      name: cursor
      in: query
      description: Opaque signed keyset cursor bound to tenant, route, sort and filters.
      schema:
        type: string
        minLength: 16
        maxLength: 1024
        pattern: "^[A-Za-z0-9_-]+$"
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SearchQuery:
      name: q
      in: query
      description: Trimmed query over the endpoint-specific allowlist of fields.
      schema:
        type: string
        minLength: 2
        maxLength: 100
    ReportFrom:
      name: from
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/BusinessDate"
    ReportTo:
      name: to
      in: query
      required: true
      description: Inclusive business date; the from/to window cannot exceed 366 days.
      schema:
        $ref: "#/components/schemas/BusinessDate"

  headers:
    ETag:
      description: Strong aggregate lock-version ETag used by If-Match.
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    Location:
      description: Relative URL of the created resource.
      required: true
      schema:
        type: string
        format: uri-reference
    RequestId:
      description: Non-secret request correlation identifier.
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    RetryAfter:
      description: Number of seconds before a retry is allowed.
      required: true
      schema:
        type: integer
        minimum: 1

  requestBodies:
    ReasonRequired:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReasonRequest"
    WorkerBatch:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkerBatchRequest"

  responses:
    NoContent:
      description: Operation completed with no response body.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
    WorkerBatchResult:
      description: Worker batch counters; no payload or recipient data is returned.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkerResultEnvelope"
    BadRequest:
      description: Malformed request, invalid cursor or unsupported filter combination.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: Authentication or webhook signature is absent or invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: Authenticated actor lacks the required organization role or CSRF proof.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: Resource does not exist in the authorized tenant or is intentionally hidden.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Conflict:
      description: State transition, schedule or active-version conflict.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PreconditionFailed:
      description: If-Match lock version is stale.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PayloadTooLarge:
      description: Request or upload exceeds the endpoint limit.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    UnsupportedMediaType:
      description: Content type or upload media type is not accepted.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    UnprocessableEntity:
      description: Schema validation or business precondition failed.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PreconditionRequired:
      description: A required If-Match header is missing.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    RateLimited:
      description: Rate or abuse limit exceeded.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InternalError:
      description: Unexpected server error without implementation details.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ProviderUnavailable:
      description: A synchronous external-provider verification is temporarily unavailable.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

  schemas:
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    BusinessDate:
      type: string
      format: date
    MoneyMinor:
      type: string
      description: Non-negative integer minor units; never a JSON floating-point number.
      pattern: "^(0|[1-9][0-9]*)$"
      maxLength: 19
      examples: ["2490"]
    SignedMoneyMinor:
      type: string
      description: Signed integer minor units used for additive or deductive change orders.
      pattern: "^-?(0|[1-9][0-9]*)$"
      maxLength: 20
    Quantity:
      type: string
      description: Positive decimal quantity with at most three fractional digits.
      pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{1,3})?$"
      maxLength: 24
      examples: ["1.000"]
    TaxRate:
      type: string
      description: Decimal fraction from zero through one, with at most four fractional digits.
      pattern: "^(0(\\.[0-9]{1,4})?|1(\\.0{1,4})?)$"
      examples: ["0.0500"]
    Currency:
      type: string
      pattern: "^[A-Z]{3}$"
      default: TWD
      examples: [TWD]
    E164Phone:
      type: string
      pattern: "^\\+[1-9][0-9]{7,14}$"
      examples: ["+886912345678"]
    LockVersion:
      type: integer
      minimum: 1
    NonEmptyText:
      type: string
      minLength: 1
      maxLength: 5000
    ShortText:
      type: string
      minLength: 1
      maxLength: 200

    Role:
      type: string
      enum: [owner, admin, dispatcher, technician, accountant, viewer]
    MembershipStatus:
      type: string
      enum: [invited, active, suspended, removed]
    IndustryTemplate:
      type: string
      description: A starting configuration, not a hard-coded business vertical.
      enum: [general_field_service, cooling, plumbing, waterproofing, renovation]
    OrganizationStatus:
      type: string
      enum: [active, suspended, closed]
    CustomerKind:
      type: string
      enum: [individual, company]
    CustomerSource:
      type: string
      enum: [line, phone, web, referral, manual, import]
    AssetStatus:
      type: string
      enum: [active, inactive, retired]
    Priority:
      type: string
      enum: [low, normal, high, urgent]
    ServiceRequestSource:
      type: string
      enum: [line, phone, web, referral, manual]
    ServiceRequestStatus:
      type: string
      enum: [new, triaged, quoting, quoted, converted, declined, cancelled]
    ProjectStatus:
      type: string
      enum: [draft, active, on_hold, completed, cancelled]
    WorkOrderStatus:
      type: string
      enum: [draft, scheduled, dispatched, en_route, on_site, paused, completed, cancelled]
    WorkOrderAction:
      type: string
      enum: [dispatch, enRoute, arrive, pause, resume, complete, cancel, reopen]
    AssignmentDuty:
      type: string
      enum: [lead, technician, helper, observer]
    AssignmentStatus:
      type: string
      enum: [assigned, accepted, declined, checked_in, completed, cancelled]
    ChecklistItemType:
      type: string
      enum: [boolean, text, number, single_choice, multi_choice, photo]
    ChecklistStatus:
      type: string
      enum: [pending, in_progress, completed, reopened]
    PhotoCategory:
      type: string
      enum: [intake, before, after, issue, receipt, signature, other]
    PhotoStatus:
      type: string
      enum: [pending, processing, ready, quarantined, failed, deleted]
    QuoteStatus:
      type: string
      enum: [draft, sent, viewed, accepted, rejected, expired, cancelled]
    QuoteVersionStatus:
      type: string
      enum: [draft, sent, superseded, accepted, rejected, expired, cancelled]
    QuoteApprovalStatus:
      type: string
      enum: [not_submitted, pending, approved, changes_requested]
    PublicDecision:
      type: string
      enum: [accept, reject]
    ChangeOrderKind:
      type: string
      enum: [addition, deduction]
    ChangeOrderStatus:
      type: string
      enum: [draft, sent, accepted, rejected, cancelled]
    PaymentStatus:
      type: string
      enum: [pending, invoiced, overdue, paid, waived, cancelled]
    PaymentMethod:
      type: string
      enum: [cash, transfer, card, other]
    MaintenanceStatus:
      type: string
      enum: [active, paused, completed, cancelled]
    NotificationStatus:
      type: string
      enum: [pending, processing, sent, delivered, failed, cancelled]
    NotificationChannel:
      type: string
      enum: [line, in_app, email, sms]
    NotificationApprovalStatus:
      type: string
      enum: [not_required, pending, approved, rejected]
    LineChannelStatus:
      type: string
      enum: [pending, active, disabled, error]

    ListMeta:
      type: object
      additionalProperties: false
      properties:
        nextCursor:
          type: [string, "null"]
          minLength: 16
          maxLength: 1024
        hasMore:
          type: boolean
      required: [nextCursor, hasMore]
    ProblemFieldError:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
          maxLength: 500
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
        message:
          type: string
          maxLength: 1000
      required: [path, code, message]
    ProblemDetails:
      type: object
      additionalProperties: false
      description: RFC 9457-compatible error with stable application code and no stack traces.
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 2000
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
        requestId:
          type: string
          minLength: 8
          maxLength: 128
        errors:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ProblemFieldError"
        latestLockVersion:
          $ref: "#/components/schemas/LockVersion"
      required: [type, title, status, code, requestId]
    ReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 2
          maxLength: 1000
      required: [reason]
    ActorSummary:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [user, customer, system, line]
        id:
          type: [string, "null"]
          format: uuid
        displayName:
          type: [string, "null"]
          maxLength: 200
      required: [type, id, displayName]
    Event:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        aggregateType:
          type: string
          maxLength: 64
        aggregateId:
          $ref: "#/components/schemas/Uuid"
        eventType:
          type: string
          maxLength: 160
        occurredAt:
          $ref: "#/components/schemas/Timestamp"
        recordedAt:
          $ref: "#/components/schemas/Timestamp"
        chainSequence:
          type: integer
          minimum: 1
        actor:
          $ref: "#/components/schemas/ActorSummary"
        summary:
          type: string
          maxLength: 1000
      required: [id, aggregateType, aggregateId, eventType, occurredAt, recordedAt, chainSequence, actor, summary]
    EventListEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        meta:
          $ref: "#/components/schemas/ListMeta"
      required: [data, meta]

    Health:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          maxLength: 100
        time:
          $ref: "#/components/schemas/Timestamp"
      required: [status, version, time]
    HealthEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/Health"
      required: [data]

    SessionUser:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        email:
          type: string
          format: email
          maxLength: 320
        displayName:
          type: string
          minLength: 1
          maxLength: 200
      required: [id, email, displayName]
    Membership:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        organizationId:
          $ref: "#/components/schemas/Uuid"
        userId:
          type: [string, "null"]
          format: uuid
        email:
          type: string
          format: email
          maxLength: 320
        displayName:
          type: string
          maxLength: 200
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/MembershipStatus"
        phone:
          anyOf:
            - $ref: "#/components/schemas/E164Phone"
            - type: "null"
        lockVersion:
          $ref: "#/components/schemas/LockVersion"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
      required: [id, organizationId, userId, email, displayName, role, status, phone, lockVersion, createdAt, updatedAt]
    Organization:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
          maxLength: 200
        legalName:
          type: [string, "null"]
          maxLength: 200
        phone:
          anyOf:
            - $ref: "#/components/schemas/E164Phone"
            - type: "null"
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          examples: [Asia/Taipei]
        locale:
          type: string
          pattern: "^[a-z]{2}(?:-[A-Z]{2})?$"
          examples: [zh-TW]
        currency:
          $ref: "#/components/schemas/Currency"
        industryTemplate:
          $ref: "#/components/schemas/IndustryTemplate"
        status:
          $ref: "#/components/schemas/OrganizationStatus"
        lockVersion:
          $ref: "#/components/schemas/LockVersion"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
      required: [id, name, legalName, phone, timezone, locale, currency, industryTemplate, status, lockVersion, createdAt, updatedAt]
    Session:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        memberships:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Membership"
      required: [user, memberships]
    SessionEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/Session"
      required: [data]
    OrganizationEnvelope:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/Organization"
      required: [data]
    OrganizationCreated:
      type: object
      additionalProperties: false
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
