    Customer:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        kind:
          $ref: "#/components/schemas/CustomerKind"
        name:
          type: string
          minLength: 1
          maxLength: 200
        companyName:
          type: [string, "null"]
          maxLength: 200
        phone:
          anyOf:
            - $ref: "#/components/schemas/E164Phone"
            - type: "null"
        email:
          type: [string, "null"]
          format: email
          maxLength: 320
        source:
          $ref: "#/components/schemas/CustomerSource"
        notes:
          type: [string, "null"]
          maxLength: 5000
        marketingConsent:
          type: boolean
        marketingConsentAt:
          anyOf:
