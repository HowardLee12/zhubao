openapi: 3.1.0
info:
  title: Renoly v2 API
  version: 0.1.0
  description: |
    Machine-readable contract for the clean-slate Renoly v2 API.
    The normative prose remains docs/api-spec.md. Employee operations always
    verify the path organization, active membership, role and resource tenant.
    Cross-tenant resources are returned as 404 to avoid existence disclosure.
  contact:
    name: Renoly engineering
servers:
  - url: /api/v2
    description: Same-origin application API

x-employee-read-security: &employeeReadSecurity
  - employeeSession: []
x-employee-write-security: &employeeWriteSecurity
  - employeeSession: []
    csrfToken: []
x-line-webhook-security: &lineWebhookSecurity
  - lineSignature: []
x-standard-errors: &standardErrors
  "400":
    $ref: "#/components/responses/BadRequest"
  "401":
    $ref: "#/components/responses/Unauthorized"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "412":
    $ref: "#/components/responses/PreconditionFailed"
  "422":
    $ref: "#/components/responses/UnprocessableEntity"
  "428":
    $ref: "#/components/responses/PreconditionRequired"
  "429":
    $ref: "#/components/responses/RateLimited"
  "500":
    $ref: "#/components/responses/InternalError"

security: *employeeReadSecurity

tags:
  - name: Health
  - name: Session
  - name: Organizations
  - name: Customers
  - name: Service requests
  - name: Public intake
  - name: Projects
  - name: Work orders
  - name: Checklists
  - name: Photos
  - name: Events
  - name: Service catalog
  - name: Quotes
  - name: Change orders
  - name: Payments
  - name: Maintenance
  - name: Notifications
  - name: LINE
  - name: Dashboard

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Process liveness and deployment health
      description: Does not expose credentials, dependency URLs or tenant data.
      security: []
      responses:
        <<: *standardErrors
        "200":
          description: Service is accepting requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"

  /session:
    get:
      tags: [Session]
      operationId: getSession
      summary: Get the authenticated user and active memberships
      responses:
        <<: *standardErrors
        "200":
          description: Current session without provider tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"

  /organizations:
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Create an organization and owner membership atomically
      security: *employeeWriteSecurity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        <<: *standardErrors
        "201":
          description: Organization and owner membership created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationCreatedEnvelope"

  /organizations/{orgId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: Get an organization summary
      responses:
        <<: *standardErrors
        "200":
          description: Organization summary.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationEnvelope"
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      summary: Update low-risk organization settings
      security: *employeeWriteSecurity
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        <<: *standardErrors
        "200":
          description: Updated organization.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationEnvelope"

  /organizations/{orgId}/settings:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [Organizations]
      operationId: getPilotOrganizationSettings
      summary: Get the pilot organization intake settings
      description: |
        Pilot slice settings backing the public intake form. Returns the owner-
        editable name, headline and privacy notice with an optimistic-lock
        version. Implemented by the get_pilot_organization_settings RPC.
      responses:
        <<: *standardErrors
        "200":
          description: Pilot organization settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotOrganizationSettingsEnvelope"
    patch:
      tags: [Organizations]
      operationId: updatePilotOrganizationSettings
      summary: Update pilot organization intake settings under optimistic locking
      description: |
        Only the pilot owner or admin may edit. The client must send the current
        lockVersion; a stale version is rejected with 409. Implemented by the
        update_pilot_organization_settings RPC.
      security: *employeeWriteSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePilotOrganizationSettingsRequest"
      responses:
        <<: *standardErrors
        "200":
          description: Updated pilot organization settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotOrganizationSettingsEnvelope"

  /organizations/{orgId}/public-intake-link/actions/rotate:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      tags: [Organizations, Public intake]
      operationId: rotatePilotPublicIntakeLink
      summary: Rotate the pilot public intake link and return the new URL once
      description: |
        Mints a new public intake token, stores only its hash, and returns the
        raw share URL exactly once. The previous link stops working. Only the
        pilot owner or admin may rotate. Implemented by the
        rotate_pilot_intake_token RPC.
      security: *employeeWriteSecurity
      responses:
        <<: *standardErrors
        "200":
          description: New public intake share URL, returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotPublicIntakeLinkEnvelope"

  /organizations/{orgId}/memberships:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [Organizations]
      operationId: listMemberships
      summary: List organization memberships
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        <<: *standardErrors
        "200":
          description: Membership page; technician and viewer DTOs are redacted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipListEnvelope"
    post:
      tags: [Organizations]
      operationId: inviteMembership
      summary: Invite an organization member
      security: *employeeWriteSecurity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMembershipRequest"
      responses:
        <<: *standardErrors
        "201":
          description: Membership invitation created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipEnvelope"

  /organizations/{orgId}/memberships/{id}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ResourceId"
    patch:
      tags: [Organizations]
      operationId: updateMembership
      summary: Update membership display data
      security: *employeeWriteSecurity
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMembershipRequest"
      responses:
        <<: *standardErrors
        "200":
          description: Membership updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipEnvelope"

  /organizations/{orgId}/memberships/{id}/actions/change-role:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/IfMatch"
    post:
      tags: [Organizations]
      operationId: changeMembershipRole
      summary: Change a member role without removing the last owner
      security: *employeeWriteSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRoleRequest"
      responses:
        <<: *standardErrors
        "200":
          description: Role changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipEnvelope"

  /organizations/{orgId}/memberships/{id}/actions/suspend:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/IfMatch"
    post:
      tags: [Organizations]
      operationId: suspendMembership
      summary: Suspend a membership
      security: *employeeWriteSecurity
      responses:
        <<: *standardErrors
        "200":
          description: Membership suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipEnvelope"

  /organizations/{orgId}/memberships/{id}/actions/restore:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/IfMatch"
    post:
      tags: [Organizations]
      operationId: restoreMembership
      summary: Restore a suspended membership
      security: *employeeWriteSecurity
      responses:
        <<: *standardErrors
        "200":
          description: Membership restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipEnvelope"

  /organizations/{orgId}/customers:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: List customers
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/SearchQuery"
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/CustomerKind"
        - name: source
          in: query
          schema:
            $ref: "#/components/schemas/CustomerSource"
        - name: tag
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 30
        - name: updatedAfter
          in: query
          schema:
            $ref: "#/components/schemas/Timestamp"
      responses:
        <<: *standardErrors
        "200":
          description: Customer page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListEnvelope"
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      security: *employeeWriteSecurity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        <<: *standardErrors
        "201":
          description: Customer created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerEnvelope"

  /organizations/{orgId}/customers/{customerId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/CustomerId"
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Get a customer
      parameters:
        - name: include
          in: query
          schema:
            type: string
            enum: [defaultLocation]
      responses:
        <<: *standardErrors
        "200":
          description: Customer; assigned technicians receive a constrained DTO.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerEnvelope"
    patch:
      tags: [Customers]
      operationId: updateCustomer
      summary: Update a customer
      security: *employeeWriteSecurity
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
      responses:
        <<: *standardErrors
        "200":
          description: Customer updated.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerEnvelope"
    delete:
      tags: [Customers]
      operationId: deleteCustomer
      summary: Soft-delete a customer
      security: *employeeWriteSecurity
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        <<: *standardErrors
        "204":
          $ref: "#/components/responses/NoContent"

  /organizations/{orgId}/customers/{customerId}/locations:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/CustomerId"
    get:
      tags: [Customers]
      operationId: listCustomerLocations
      summary: List customer locations
      responses:
        <<: *standardErrors
        "200":
          description: Customer locations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationListEnvelope"
    post:
      tags: [Customers]
      operationId: createCustomerLocation
      summary: Create a customer service location
      security: *employeeWriteSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationRequest"
      responses:
        <<: *standardErrors
        "201":
          description: Location created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationEnvelope"

  /organizations/{orgId}/locations/{locationId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/LocationId"
    get:
      tags: [Customers]
      operationId: getLocation
      summary: Get a service location
      responses:
        <<: *standardErrors
        "200":
          description: Service location.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationEnvelope"
    patch:
      tags: [Customers]
      operationId: updateLocation
      summary: Update a service location
      security: *employeeWriteSecurity
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocationRequest"
      responses:
        <<: *standardErrors
        "200":
          description: Location updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationEnvelope"
    delete:
      tags: [Customers]
      operationId: deleteLocation
      summary: Soft-delete a location when no active work order depends on it
      security: *employeeWriteSecurity
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        <<: *standardErrors
        "204":
          $ref: "#/components/responses/NoContent"

  /organizations/{orgId}/locations/{locationId}/assets:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/LocationId"
    get:
      tags: [Customers]
      operationId: listLocationAssets
      summary: List assets at a location
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/AssetStatus"
        - name: assetType
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 80
      responses:
        <<: *standardErrors
        "200":
          description: Asset page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetListEnvelope"
    post:
      tags: [Customers]
      operationId: createAsset
      summary: Create an asset at a customer location
      security: *employeeWriteSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        <<: *standardErrors
        "201":
          description: Asset created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetEnvelope"

  /organizations/{orgId}/assets/{assetId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/AssetId"
    get:
      tags: [Customers]
      operationId: getAsset
      summary: Get an asset
      responses:
        <<: *standardErrors
        "200":
          description: Asset.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetEnvelope"
    patch:
      tags: [Customers]
      operationId: updateAsset
      summary: Update an asset
      security: *employeeWriteSecurity
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssetRequest"
      responses:
        <<: *standardErrors
        "200":
          description: Asset updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetEnvelope"
    delete:
      tags: [Customers]
      operationId: retireAsset
      summary: Retire and soft-delete an asset while retaining history
      security: *employeeWriteSecurity
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        <<: *standardErrors
        "204":
          $ref: "#/components/responses/NoContent"

  /organizations/{orgId}/assets/{assetId}/history:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/AssetId"
    get:
      tags: [Customers]
      operationId: getAssetHistory
      summary: Get merged work-order, photo and event history for an asset
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        <<: *standardErrors
        "200":
          description: Asset history page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListEnvelope"

  /organizations/{orgId}/service-requests:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [Service requests]
      operationId: listServiceRequests
      summary: List service requests
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/SearchQuery"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ServiceRequestStatus"
        - name: priority
          in: query
          schema:
            $ref: "#/components/schemas/Priority"
        - name: source
          in: query
          schema:
            $ref: "#/components/schemas/ServiceRequestSource"
        - name: assignedMemberId
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: createdFrom
          in: query
          schema:
            $ref: "#/components/schemas/Timestamp"
        - name: createdTo
          in: query
          schema:
            $ref: "#/components/schemas/Timestamp"
      responses:
        <<: *standardErrors
        "200":
          description: Service request page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestListEnvelope"
    post:
      tags: [Service requests]
      operationId: createServiceRequest
      summary: Create a staff-entered service request
      security: *employeeWriteSecurity
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequestRequest"
      responses:
        <<: *standardErrors
        "201":
          description: Service request created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestEnvelope"

  /organizations/{orgId}/service-requests/{id}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Service requests]
      operationId: getServiceRequest
      summary: Get a service request
      responses:
        <<: *standardErrors
        "200":
          description: Service request.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestEnvelope"
    patch:
      tags: [Service requests]
      operationId: updateServiceRequest
      summary: Update service request content without changing status
      security: *employeeWriteSecurity
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceRequestRequest"
      responses:
        <<: *standardErrors
        "200":
          description: Service request updated.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestEnvelope"

  /organizations/{orgId}/service-requests/{id}/actions/triage:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/IfMatch"
    post:
      tags: [Service requests]
      operationId: triageServiceRequest
      summary: Link request context and move new to triaged
      security: *employeeWriteSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageServiceRequestRequest"
      responses:
        <<: *standardErrors
        "200":
          description: Triaged request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestEnvelope"

  /organizations/{orgId}/service-requests/{id}/actions/start-quoting:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/IfMatch"
    post:
      tags: [Service requests]
      operationId: startServiceRequestQuoting
      summary: Move a triaged request into quoting
      security: *employeeWriteSecurity
      responses:
        <<: *standardErrors
        "200":
          description: Request now quoting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestEnvelope"

  /organizations/{orgId}/service-requests/{id}/actions/mark-quoted:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/IfMatch"
    post:
      tags: [Service requests]
      operationId: markServiceRequestQuoted
      summary: Mark request quoted after a quote version was sent
      security: *employeeWriteSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkQuotedRequest"
      responses:
        <<: *standardErrors
        "200":
          description: Request marked quoted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestEnvelope"

  /organizations/{orgId}/service-requests/{id}/actions/convert:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/IfMatch"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      tags: [Service requests]
      operationId: convertServiceRequest
      summary: Convert request atomically into a work order or project
      security: *employeeWriteSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertServiceRequestRequest"
      responses:
        <<: *standardErrors
        "201":
          description: Conversion resources created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionEnvelope"

  /organizations/{orgId}/service-requests/{id}/actions/decline:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/IfMatch"
    post:
      tags: [Service requests]
      operationId: declineServiceRequest
      summary: Decline a service request with a reason
      security: *employeeWriteSecurity
      requestBody:
        $ref: "#/components/requestBodies/ReasonRequired"
      responses:
        <<: *standardErrors
        "200":
          description: Request declined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestEnvelope"

  /organizations/{orgId}/service-requests/{id}/actions/cancel:
    parameters:
