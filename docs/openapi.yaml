          pattern: "^[a-z]{2}(?:-[A-Z]{2})?$"
        currency:
          $ref: "#/components/schemas/Currency"
        industryTemplate:
          $ref: "#/components/schemas/IndustryTemplate"
      required: [name, timezone, locale, currency, industryTemplate]
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        legalName:
          type: [string, "null"]
          maxLength: 200
        phone:
          anyOf:
            - $ref: "#/components/schemas/E164Phone"
            - type: "null"
        timezone:
          type: string
          minLength: 1
